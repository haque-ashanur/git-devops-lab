
name: DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run repository validation
        run: bash scripts/validate.sh

  report:
    name: Report Test Result
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Confirm tests passed
        run: echo "All automated tests passed!"
